apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: orders-service
  namespace: orders
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: orders-service
  minReplicaCount: 2
  maxReplicaCount: 10
  cooldownPeriod: 30
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
        query: sum(rate(nginx_ingress_controller_requests{ingress="orders-service"}[1m]))
        threshold: "5"
        activationThreshold: "1"
